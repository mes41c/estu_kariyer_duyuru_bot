name: ESTU Duyuru Botu

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı çalışır (İstersen '*/30 * * * *' yaparak 30 dakikada bir çalıştırabilirsin)
  workflow_dispatch: # Manuel tetikleme için

permissions:
  contents: write # Dosyayı güncellemek (commit atmak) için yazma izni lazım

jobs:
  run_bot:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kütüphaneleri Yükle
        run: |
          pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Değişiklikleri Commit ve Push Et
        # Eğer main.py dosyayı değiştirdiyse (yeni duyuru varsa), bunu kaydet.
        run: |
          git config --global user.name 'ESTU Bot'
          git config --global user.email 'bot@noreply.github.com'
          git add last_announcement.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Yeni duyuru güncellendi" && git push)